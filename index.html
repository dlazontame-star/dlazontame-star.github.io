<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabegram Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Блокировка выделения и вызова контекстного меню */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .carousel {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none;
            -ms-overflow-style: none;
            
            /* Отступы 20px со всех сторон (сверху тоже 20px) */
            padding: 20px; 
        }
        
        .carousel::-webkit-scrollbar {
            display: none;
        }

        .card {
            flex: 0 0 auto;
            height: 100%; 
            aspect-ratio: 390 / 844;
            
            /* Отступ между карточками (по умолчанию) */
            margin-right: 14px;
            
            border-radius: 0; 
            background-color: transparent; /* Убрали фон, чтобы не было доп. отступов */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            scroll-snap-align: center;
            transition: transform 0.3s ease;
            
            /* Скрываем всё, что выходит за пределы */
            overflow: hidden;
        }

        .card:last-child {
            margin-right: 0;
        }

        /* Ссылка для 9-й карточки */
        .card-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            /* Картинка полностью заполняет карточку, без белых полос */
            object-fit: cover; 
            display: block;
            -webkit-user-drag: none; 
            pointer-events: none; /* Запрещаем клики/сохранение самой картинки */
        }

        /* ==========================================
           АДАПТИВ ДЛЯ МОБИЛЬНЫХ (до 600px)
           ========================================== */
        @media (max-width: 600px) {
            .carousel {
                /* Оставляем 20px сверху и по краям */
                padding: 20px; 
            }

            .card {
                /* Вычисляем ширину: (100vw - 40px отступы по краям) / 1.15 (оставляем место для следующей) */
                width: calc((100vw - 40px) / 1.15); 
                height: 100%; 
                margin-right: 10px; /* На мобилке между карточками 10px */
                aspect-ratio: auto; 
            }

            .card img {
                /* На мобилке используем contain, чтобы картинки не обрезались */
                object-fit: contain; 
            }
        }
    </style>
</head>
<body>

    <div class="carousel" id="carousel">
        <div class="card">
            <img src="1%20клиент%20telegram.png" alt="Клиент Telegram" draggable="false">
        </div>
        <div class="card">
            <img src="2%20Ваш%20новый%20профиль.png" alt="Ваш новый профиль" draggable="false">
        </div>
        <div class="card">
            <img src="3%20Ваше%20персональное%20меню.png" alt="Ваше персональное меню" draggable="false">
        </div>
        <div class="card">
            <img src="4%20VPN%20прямо%20в%20Jabagram.png" alt="VPN прямо в Jabagram" draggable="false">
        </div>
        <div class="card">
            <img src="5%20AI%20генерация%20стикер%20паков.png" alt="AI генерация стикер паков" draggable="false">
        </div>
        <div class="card">
            <img src="6%20Market%20Plugins.png" alt="Market Plugins" draggable="false">
        </div>
        <div class="card">
            <img src="8%20Jabegram%20-%20icon%20app.png" alt="Jabegram Icon" draggable="false">
        </div>
        
        <!-- 9-я карточка со ссылкой -->
        <div class="card">
            <a href="https://t.me/www_mono" target="_blank" class="card-link">
                <img src="9%20Ищем%20команду%20для%20совместной%20работ1ы%20над%20проектом.png" alt="Ищем команду" draggable="false">
            </a>
        </div>
    </div>

    <!-- Скрипт для дополнительной блокировки (контекстное меню, горячие клавиши) -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            // Блокируем PrintScreen, Ctrl+P, Ctrl+S, Ctrl+Shift+S
            if (e.key === 'PrintScreen' || 
               (e.ctrlKey && e.key === 'p') || 
               (e.ctrlKey && e.key === 's')) {
                e.preventDefault();
                alert('Скриншоты и сохранение заблокированы.');
            }
        });
    </script>
</body>
</html>
