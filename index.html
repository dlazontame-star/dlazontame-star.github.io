<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabegram Presentation</title>
    <style>
        /* Сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Контейнер карусели */
        .carousel {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none;
            -ms-overflow-style: none;
            
            /* По умолчанию (ПК) отступы 14px */
            padding: 14px; 
        }
        
        .carousel::-webkit-scrollbar {
            display: none;
        }

        /* Карточка (ПК) */
        .card {
            flex: 0 0 auto;
            height: 100%; 
            aspect-ratio: 390 / 844;
            margin-right: 14px;
            border-radius: 0; 
            background-color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            scroll-snap-align: center;
            transition: transform 0.3s ease;
        }

        .card:last-child {
            margin-right: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            -webkit-user-drag: none; 
        }

        /* ==========================================
           УЛУЧШЕННЫЙ АДАПТИВ ДЛЯ МОБИЛЬНЫХ (до 600px)
           ========================================== */
        @media (max-width: 600px) {
            .carousel {
                /* Отступ по 10px слева и справа, чтобы карточка не прилипала к краям */
                padding: 0 10px; 
            }

            .card {
                /* 
                   Вычисляем ширину так, чтобы влезла одна карточка + отступ 10px + кусочек следующей.
                   Берем 100% ширины экрана, вычитаем отступы по краям (20px) 
                   и делим на 1.15, чтобы оставить примерно 15% на "подглядывание" следующей карточки.
                */
                width: calc((100vw - 20px) / 1.15); 
                height: 100%; 
                /* Отступ между карточками строго 10px */
                margin-right: 10px; 
                aspect-ratio: auto; 
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }

            .card img {
                /* Возвращаем contain на мобильных, чтобы картинки не обрезались, 
                   а полностью вписывались в карточку (появятся небольшие белые поля сверху/снизу, 
                   если пропорции картинки чуть отличаются от пропорций карточки) */
                object-fit: contain; 
                background-color: #f8f9fa; /* Очень светлый фон для карточки */
            }
        }
    </style>
</head>
<body>

    <div class="carousel">
        <div class="card">
            <img src="1%20клиент%20telegram.png" alt="Клиент Telegram" draggable="false">
        </div>
        <div class="card">
            <img src="2%20Ваш%20новый%20профиль.png" alt="Ваш новый профиль" draggable="false">
        </div>
        <div class="card">
            <img src="3%20Ваше%20персональное%20меню.png" alt="Ваше персональное меню" draggable="false">
        </div>
        <div class="card">
            <img src="4%20VPN%20прямо%20в%20Jabagram.png" alt="VPN прямо в Jabagram" draggable="false">
        </div>
        <div class="card">
            <img src="5%20AI%20генерация%20стикер%20паков.png" alt="AI генерация стикер паков" draggable="false">
        </div>
        <div class="card">
            <img src="6%20Market%20Plugins.png" alt="Market Plugins" draggable="false">
        </div>
        <div class="card">
            <img src="8%20Jabegram%20-%20icon%20app.png" alt="Jabegram Icon" draggable="false">
        </div>
        <div class="card">
            <img src="9%20Ищем%20команду%20для%20совместной%20работ1ы%20над%20проектом.png" alt="Ищем команду" draggable="false">
        </div>
    </div>

</body>
</html>
