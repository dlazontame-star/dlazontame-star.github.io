<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word + Translation | Чистый минимализм</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Ваш фон */
            background-image: url('https://avatars.mds.yandex.net/i?id=2072e5ce4cc4088846f7d61fe1e9415d_l-4969143-images-thumbs&n=13');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
        }

        /* Мягкое затемнение фона для читаемости текста */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4); /* Простое равномерное затемнение */
            pointer-events: none;
            z-index: 1;
        }

        /* Контейнер с текстом - без стекла, просто текст */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            color: white;
            width: 100%;
            max-width: 90%;
            padding: 20px;
        }

        /* Английское слово */
        .english-word {
            font-size: clamp(3.5rem, 18vw, 9rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            color: white;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Перевод */
        .translation {
            font-size: clamp(2.2rem, 10vw, 5rem);
            font-weight: 300;
            display: inline-block;
            padding-top: 1rem;
            margin-top: 0.5rem;
            border-top: 2px solid rgba(255, 255, 255, 0.5);
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.02em;
        }

        /* Маленький хинт внизу */
        .hint {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            z-index: 10;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 300;
            padding: 8px 0;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,700;14..32,800&display=swap');
    </style>
</head>
<body>
    <div class="container">
        <div class="english-word">Sunset</div>
        <div class="translation">Закат</div>
    </div>

    <div class="hint">english · translation · pure minimalism</div>
</body>
</html>
